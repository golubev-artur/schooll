<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Мой ИИ-репетитор</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#130a12;--card:rgba(255,255,255,.06);--card2:rgba(255,255,255,.1);--line:rgba(255,255,255,.12);--tx:#fff4ee;--mut:#c4a9ad;--acc:#ff5a4d;--acc2:#ffc857;--vio:#b06cff;--ok:#3ddc97;--bad:#ff6b81;--r:24px;--c1:#ffc857;--c2:#ff6b5c;--fd:'Unbounded','Manrope',system-ui,sans-serif}
:root[data-t=light]{--c1:#b26a00;--c2:#d6362a;--bg:#fff6f0;--card:rgba(255,255,255,.85);--card2:rgba(120,40,30,.08);--line:rgba(120,40,30,.14);--tx:#2a0f14;--mut:#8a5f63}
*{box-sizing:border-box}
body{margin:0;font:16px/1.55 'Manrope',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;overflow-x:hidden}
body:before,body:after{content:"";position:fixed;z-index:-1;width:60vmax;height:60vmax;border-radius:50%;filter:blur(90px);opacity:.35;animation:drift 18s ease-in-out infinite alternate}
body:before{background:#ff5a4d;top:-25vmax;right:-20vmax}body:after{background:#b06cff;bottom:-30vmax;left:-25vmax;animation-delay:-9s;opacity:.28}
@keyframes drift{to{transform:translate(6vmax,4vmax) scale(1.1)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes fade{from{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes pop{50%{transform:scale(1.04)}}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;position:sticky;top:0;backdrop-filter:blur(18px);background:color-mix(in srgb,var(--bg) 60%,transparent);border-bottom:1px solid var(--line);z-index:5}
.logo{font:700 15px var(--fd);display:flex;gap:10px;align-items:center;white-space:nowrap}.logo svg{width:28px;height:28px}
.ava{width:34px;height:34px;border-radius:50%;object-fit:cover;border:2px solid var(--acc2)}
nav{display:flex;align-items:center;gap:6px;margin-left:auto;overflow-x:auto;scrollbar-width:none}nav button{white-space:nowrap}
button{font:600 15px 'Manrope',sans-serif;cursor:pointer;border:1px solid var(--line);border-radius:999px;padding:9px 16px;background:var(--card);color:var(--tx);transition:.18s}
button:hover{transform:translateY(-2px);background:var(--card2)}
button.on,button.pri{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#2b0d08;font-weight:800;border-color:transparent;box-shadow:0 8px 24px #ff5a4d44}
main{max-width:980px;margin:0 auto;padding:8px 16px 70px}main>*{animation:rise .32s both}main>*:nth-child(2){animation-delay:.05s}main>*:nth-child(3){animation-delay:.1s}
.card{background:var(--card);border:1px solid var(--line);backdrop-filter:blur(14px);border-radius:var(--r);padding:22px;margin:14px 0;box-shadow:0 20px 50px #0004}
h1{font:700 clamp(24px,5vw,40px)/1.15 var(--fd);margin:.2em 0 .4em}h2{font:700 18px var(--fd);margin:.2em 0 .7em}.mut{color:var(--mut)}
.hero{position:relative;border-radius:32px;overflow:hidden;margin:14px 0;min-height:400px;display:flex;align-items:flex-end;border:1px solid var(--line);background:linear-gradient(135deg,#3a0d18,#7a1d24 50%,#c2411f);box-shadow:0 30px 70px #0006}
.hero .bg{position:absolute;inset:0;background-size:cover;background-position:center 30%;transition:opacity .8s;opacity:0}.hero .bg.show{opacity:1}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#130a12ee 8%,#130a1255 55%,transparent)}
.hero-in{position:relative;z-index:2;padding:26px;width:100%;display:flex;gap:20px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.hero h1{color:#fff;text-shadow:0 2px 20px #0008}.hero p{color:#ffe9dd;max-width:460px}
.thumbs{position:absolute;z-index:3;top:16px;right:16px;display:flex;gap:6px}.thumbs img{width:40px;height:40px;object-fit:cover;border-radius:12px;border:2px solid #fff6;cursor:pointer;opacity:.75}.thumbs img.on{border-color:var(--acc2);opacity:1}
.ring{width:150px;flex:none;filter:drop-shadow(0 6px 20px #0008)}.ring text{fill:#fff;font:700 26px var(--fd)}.ring .lbl{font:600 9px 'Manrope';fill:#ffe9dd}
.bead{transition:.6s}.hoop-spin{transform-origin:60px 60px;animation:spin 40s linear infinite}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stat{background:var(--card2);border:1px solid var(--line);border-radius:18px;padding:14px;font-size:14px;color:var(--mut)}.stat b{font:700 26px var(--fd);display:block;color:var(--tx)}
.bar{height:10px;border-radius:9px;background:var(--card2);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:9px;transition:width .8s}
input,textarea{font:inherit;width:100%;padding:13px 16px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);color:var(--tx)}input:focus,textarea:focus{outline:0;border-color:var(--acc2);box-shadow:0 0 0 4px #ffc85722}
.q{font-size:21px;font-weight:600;margin:8px 0 14px}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.row input{flex:1;min-width:140px}
.hint{background:#ffc85718;border:1px solid #ffc85744;border-left:4px solid var(--acc2);padding:10px 14px;border-radius:14px;margin:8px 0;animation:rise .3s}
.ok{color:var(--ok)}.bad{color:var(--bad)}.win{animation:pop .5s}
.chat{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow:auto;padding:4px}
.m{padding:11px 15px;border-radius:18px;max-width:85%;white-space:pre-wrap;animation:rise .25s}.m.u{align-self:flex-end;background:linear-gradient(135deg,var(--acc),#d63a5a);color:#fff;border-bottom-right-radius:6px}.m.a{background:var(--card2);border:1px solid var(--line);border-bottom-left-radius:6px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:9px 8px;text-align:left;border-bottom:1px solid var(--line)}
.tag{display:inline-block;padding:3px 12px;border-radius:99px;font-size:13px;background:var(--card2);border:1px solid var(--line)}
.day{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.day b{min-width:64px;color:var(--acc2)}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}.chip{background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:12px 14px}.chip small{color:var(--mut)}
.photos{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}.photos div{position:relative}.photos img{width:90px;height:90px;object-fit:cover;border-radius:16px}.photos button{position:absolute;top:-6px;right:-6px;padding:0;width:26px;height:26px}
svg text{fill:var(--mut);font-size:11px}
.xpb{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:13px;color:var(--mut)}.xpb .bar{flex:1;height:8px}.xpb .bar i{transition:width .7s cubic-bezier(.2,.8,.2,1)}#stk{font-weight:800;color:var(--acc2);min-width:46px;text-align:right}#stk.pop{animation:pop .5s}
.burst{position:absolute;left:50%;top:0;pointer-events:none}.burst i{position:absolute;width:8px;height:8px;border-radius:50%;animation:sp .8s ease-out forwards}@keyframes sp{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.lvl{position:fixed;inset:0;z-index:30;background:#000b;backdrop-filter:blur(8px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;color:#fff;cursor:pointer;animation:fade .3s;padding:20px}.lvl svg.big{width:min(62vw,260px)}.lvl h2{font-size:26px;margin:.2em 0}
.lvl .ringA{transform-origin:60px 60px;animation:spinIn 1.3s cubic-bezier(.2,.8,.2,1) both}.lvl .ringB{transform-origin:60px 60px;animation:spinB 6s linear infinite}.lvl .lb{opacity:0;transform-origin:center;animation:bead .35s forwards}
@keyframes spinIn{from{transform:rotate(-300deg) scale(.2);opacity:0}to{transform:none;opacity:1}}@keyframes spinB{to{transform:rotate(-360deg)}}@keyframes bead{from{opacity:0}to{opacity:1}}
.lvl .ei{animation:rise .6s 1.2s both}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
.chart svg{width:100%;height:auto;display:block;overflow:visible}.chart .ln{fill:none;stroke:var(--c1);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.chart .gr{stroke:var(--line);stroke-width:1}.chart .tg{stroke:var(--mut);stroke-width:1;stroke-dasharray:4 4;opacity:.7}
.chart .empty{padding:26px 10px;text-align:center;color:var(--mut);border:1px dashed var(--line);border-radius:16px}
.hb{display:grid;grid-template-columns:minmax(120px,210px) 1fr 44px;gap:10px;align-items:center;padding:5px 0;font-size:14px}.hb .tr{position:relative;height:12px;background:var(--card2);border-radius:8px}.hb .fl{height:100%;background:var(--c2);border-radius:0 6px 6px 0;min-width:3px;transition:width .7s}.hb .tgt{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--mut)}.hb b{text-align:right;font-variant-numeric:tabular-nums}.hb:hover{background:var(--card2);border-radius:10px}
#ctip{position:fixed;z-index:40;background:var(--bg);color:var(--tx);border:1px solid var(--line);padding:8px 12px;border-radius:12px;font-size:13px;pointer-events:none;display:none;box-shadow:0 8px 24px #0006}
details.tbl{margin-top:8px;font-size:13px}details.tbl summary{cursor:pointer;color:var(--mut)}.lv{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.lv span{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:6px 12px;font-size:13px}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:14px 0 4px}.ph h1{margin:.2em 0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:10px 0}.kpi{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 16px;backdrop-filter:blur(14px)}.kpi small{color:var(--mut);display:block;font-size:13px}.kpi b{font:700 26px var(--fd);white-space:nowrap;display:block;margin:4px 0}.kpi .dl{font-size:13px;font-weight:700}.dl.up{color:var(--ok)}.dl.dn{color:var(--bad)}.dl.eq{color:var(--mut)}
.verdict ul{margin:6px 0;padding-left:20px}.verdict li{margin:6px 0}.verdict .g{color:var(--ok);font-weight:700}.verdict .w{color:var(--acc2);font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;max-width:420px}.cal span{font-size:11px;color:var(--mut);text-align:center}.cl{aspect-ratio:1;border-radius:8px;background:var(--card2);border:1px solid var(--line)}.cl.l1{background:color-mix(in srgb,var(--c1) 28%,transparent)}.cl.l2{background:color-mix(in srgb,var(--c1) 50%,transparent)}.cl.l3{background:color-mix(in srgb,var(--c1) 75%,transparent)}.cl.l4{background:var(--c1)}.cl.nx{opacity:.25}.cl.td{outline:2px solid var(--tx);outline-offset:1px}
.calleg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);margin-top:10px}.calleg i{width:14px;height:14px;border-radius:4px;display:inline-block}
.pin{max-width:380px;margin:40px auto;text-align:center}.pin input{text-align:center;font-size:26px;letter-spacing:10px;max-width:220px;margin:8px auto;display:block}
details.set>summary{cursor:pointer;font:700 18px var(--fd);padding:4px 0}details.set[open]>summary{margin-bottom:10px}
.steps{margin:6px 0;padding-left:22px}.steps li{margin:4px 0;padding:3px 8px;border-radius:8px}.steps li.hl{background:#ff5a4d22;border-left:3px solid var(--bad)}
.errbox{background:#ff5a4d18;border:1px solid var(--bad);border-radius:14px;padding:10px 14px;margin:8px 0}mark{background:#ff5a4d44;color:inherit;border-radius:6px;padding:0 6px}.exq{padding:8px 0;font-size:18px}
details.wk{background:var(--card2);border:1px solid var(--line);border-radius:18px;padding:12px 16px;margin:10px 0}details.wk>summary{cursor:pointer;line-height:1.7}details.er{border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin:8px 0;background:var(--card)}details.er>summary{cursor:pointer}details.in{margin:8px 0;padding:6px 10px;border-left:3px solid var(--acc2)}details.in>summary{cursor:pointer;font-weight:700}
.op{background:#ffc85712;border:1px solid #ffc85744;border-radius:16px;padding:6px 16px;margin:10px 0}.op h3,.wk h3{margin:10px 0 4px;font-size:15px}.op ul{margin:4px 0;padding-left:20px}
.talk{background:var(--card2);border:1px solid var(--acc2);border-radius:20px;padding:14px;margin:12px 0;animation:rise .3s}.talk .th{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}.talk .chat{max-height:300px}.qchips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.qchips button{font-size:13px;padding:6px 12px}.m .tm2{display:block;font-size:11px;opacity:.6;margin-top:3px}.dots{animation:pop 1s infinite}
.els{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:10px}.el{background:var(--card2);border:1px solid var(--acc2);border-radius:18px;padding:10px;text-align:center;display:flex;flex-direction:column;align-items:center}.el b{font-size:14px}.el small{color:var(--mut)}.el.lock{opacity:.4;border-color:var(--line);filter:grayscale(1)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:linear-gradient(135deg,var(--acc),var(--acc2));color:#2b0d08;padding:14px 22px;border-radius:18px;font-weight:700;z-index:20;box-shadow:0 12px 40px #0008;animation:rise .4s;max-width:90vw;text-align:center}
.tm{position:sticky;top:60px;z-index:4;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;border-radius:18px;background:var(--bg);border:1px solid var(--acc2);margin:10px 0}.tm b{font:700 24px var(--fd)}.tm.warn b{color:var(--bad)}
.ex{margin:10px 0}.ex .n{font:700 13px var(--fd);color:var(--acc2)}.ex sup,.ex sub,.q sup,.q sub{font-size:.65em}.res{padding:10px 0;border-bottom:1px solid var(--line)}.res.no{border-left:4px solid var(--bad);padding-left:10px}.res.yes{border-left:4px solid var(--ok);padding-left:10px}
@media(max-width:560px){.logo span{display:none}.hero{min-height:460px}.ring{width:110px}}
</style>

<body>
<header>
 <div class="logo" id="logo"><svg viewBox="0 0 32 32" fill="none" stroke="url(#g)" stroke-width="3"><defs><linearGradient id="g"><stop stop-color="#ff7a59"/><stop offset="1" stop-color="#ffc857"/></linearGradient></defs><circle cx="16" cy="18" r="10"/><path d="M16 2v6"/></svg><span>Мой ИИ-репетитор</span></div>
 <nav id="nav"></nav>
</header>
<main id="app"></main>
<script>
const $=s=>document.querySelector(s), ls={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{if(!window.svFail){window.svFail=1;setTimeout(()=>toast('⚠ Не удалось сохранить прогресс. Не используйте режим инкогнито и освободите место в браузере.'),0)}}}};
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)), pick=a=>a[R(0,a.length-1)];
const gcd=(a,b)=>b?gcd(b,a%b):a;
const TOPICS={order:'Порядок действий',mul:'Умножение и деление в столбик',units:'Величины и время',motion:'Задачи на движение',geom:'Периметр и площадь',eq:'Уравнения',dec:'Десятичные дроби',fbas:'Смешанные числа и дроби',div:'Признаки делимости',gcd:'НОД и НОК',frac:'Сложение дробей',prop:'Отношения и пропорции',pct:'Проценты',circ:'Окружность и круг',neg:'Отрицательные числа',logic:'Задачи для лицея',calc:'Вычисления: дроби и десятичные',eqm:'Уравнения со смешанными числами',len:'Единицы длины (м, дм, см, мм)',vol:'Объём, проценты и доли',meet:'Движение навстречу и вдогонку',expr:'Упрощение выражений',afrac:'Дроби с буквами',lang:'Математический язык',inv:'Дробь 1/k и число k'};
const GR={order:'3–4',mul:'3–4',units:'3–4',motion:'4',geom:'4–5',eq:'5',dec:'5',fbas:'5',div:'6',gcd:'6',frac:'6',prop:'6',pct:'5–6',circ:'6',neg:'6',logic:'лицей',calc:'экз',eqm:'экз',len:'экз',vol:'экз',meet:'экз',expr:'экз',afrac:'экз',lang:'экз',inv:'экз'};
const EXAMT=['calc','eqm','len','vol','meet','expr','afrac','lang','inv'];
const isGap=k=>['3–4','4','4–5','5'].includes(GR[k]);
// порядок тем в учебнике Петерсон-6 (ч.1) — примерная неделя за неделей
const PET=['div','div','gcd','frac','frac','frac','prop','pct'];
// Генераторы: level 1..3 -> {q, a:"строка ответа", hints:[3], sol}

const fg=(a,b)=>b?fg(b,a%b):Math.abs(a);
const Fr=(n,d=1)=>{const g=fg(n,d)||1;if(d<0){n=-n;d=-d}return[n/g,d/g]};
const fadd=(a,b)=>Fr(a[0]*b[1]+b[0]*a[1],a[1]*b[1]),fsub=(a,b)=>Fr(a[0]*b[1]-b[0]*a[1],a[1]*b[1]),fmul=(a,b)=>Fr(a[0]*b[0],a[1]*b[1]),fdiv=(a,b)=>Fr(a[0]*b[1],a[1]*b[0]);
const fv=a=>a[0]/a[1];
const fh=(n,d)=>`<sup>${n}</sup>&frasl;<sub>${d}</sub>`;
const mixH=a=>{const n=a[0],d=a[1];if(d==1)return String(n);const w=Math.trunc(n/d),r=n-w*d;return(w?w:'')+fh(r,d)};
const mixT=a=>{const n=a[0],d=a[1];if(d==1)return String(n);const w=Math.trunc(n/d),r=n-w*d;return w?`${w} ${r}/${d}`:`${r}/${d}`};
const dec=x=>String(+x.toFixed(4)).replace('.',',');
const num=x=>String(+x.toFixed(4));
const pkT=(k)=>k;

const EX={};
const GEN={
frac(l){const d1=pick([2,3,4,5]),d2=pick([6,8,10,12].filter(x=>x%d1==0||l>1)),n1=R(1,d1-1),n2=R(1,d2-1);const den=d1*d2/gcd(d1,d2),num=n1*den/d1+n2*den/d2,g=gcd(num,den);
 return{q:`Акробатка отработала ${n1}/${d1} часа растяжку и ${n2}/${d2} часа элементы на кольце. Сколько часов всего? (ответ дробью)`,a:`${num/g}/${den/g}`,hints:[`Знаменатели разные (${d1} и ${d2}). Сначала приведи дроби к общему знаменателю.`,`Общий знаменатель — ${den}. Домножь числители: ${n1}·${den/d1} и ${n2}·${den/d2}.`,`Сложи числители: ${n1*den/d1}+${n2*den/d2}=${num}, получится ${num}/${den}. Сократи, если можно.`],sol:`${num}/${den} = ${num/g}/${den/g}`}},
dec(l){const a=R(12,49)/10*(l>1?1:1),b=pick([2,3,4,5]);const r=+(a*b).toFixed(2);
 return{q:`Лента для кольца стоит ${a} ₽ за 1 дм. Сколько стоят ${b} дм? (десятичной дробью)`,a:String(r),hints:[`Нужно умножить ${a} на ${b}.`,`Умножь как целые: ${Math.round(a*10)}·${b}=${Math.round(a*10)*b}.`,`В ${a} один знак после запятой — отдели один знак справа.`],sol:`${a}·${b}=${r}`}},
neg(l){const a=R(3,9+l*4),b=R(a+1,a+8+l*3);return{q:`Гимнастка из точки ${a} м опустилась на ${b} м вниз по числовой прямой (ноль — пол). Где она теперь? (число)`,a:String(a-b),hints:[`Спуск вниз — это вычитание: ${a} − ${b}.`,`Ты уходишь ниже нуля. Сначала потрать ${a} на путь до нуля.`,`Остаток ${b-a} — уже ниже нуля, поэтому знак «−».`],sol:`${a}−${b}=${a-b}`}},

const parse=s=>{s=String(s).trim().replace(',','.').replace('−','-');const mx=s.match(/^(-?\d+)\s+(\d+)\/(\d+)$/);if(mx){const w=+mx[1];return w+(w<0?-1:1)*(+mx[2]/+mx[3])}const m=s.match(/^(-?\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/);if(m)return +m[1]/+m[2];const v=Number(s);return s===''||isNaN(v)?NaN:v};
const same=(u,a)=>Math.abs(parse(u)-parse(a))<1e-6;
const nrm=t=>String(t).toLowerCase().replace(/[\s*·×]/g,'').replace(/,/g,'.').replace(/−/g,'-');
const linP=t=>{const m={};(nrm(t).match(/[+-]?\d*\.?\d*[a-z]?/g)||[]).filter(x=>x&&x!='+'&&x!='-').forEach(x=>{const mm=x.match(/^([+-]?)(\d*\.?\d*)([a-z]?)$/);if(!mm)return;let c=mm[2]===''?(mm[3]?1:0):+mm[2];if(mm[1]=='-')c=-c;m[mm[3]]=(m[mm[3]]||0)+c});return m};
const okAns=(u,it)=>{if(String(u).trim()==='')return false;if(it.lin){const a=linP(u),b=linP(it.lin),ks=new Set([...Object.keys(a),...Object.keys(b)]);return[...ks].every(k=>Math.abs((a[k]||0)-(b[k]||0))<1e-6)}
 if(it.alts)return it.alts.some(x=>nrm(x)==nrm(u));return same(u,it.a)};

const RULES={order:['Сначала скобки, потом умножение и деление, потом сложение и вычитание (слева направо).','Представь лестницу: «сильные» действия (умножение, деление) выполняются раньше «слабых» (сложение, вычитание). Скобки главнее всех.'],mul:['Умножаем столбиком: сначала на единицы, потом на десятки (со сдвигом на клетку влево), потом складываем результаты.','Разбей второе число на части: 23 = 20 + 3. Умножь на каждую часть и сложи.'],units:['1 ч = 60 мин, 1 мин = 60 с.','Часы в минуты — умножаем на 60, минуты в часы — делим на 60.'],motion:['Путь = скорость · время; время = путь : скорость; скорость = путь : время.','Закрой пальцем то, что ищешь, в «треугольнике» путь/скорость/время: остальное подскажет действие.'],geom:['Площадь прямоугольника = длина · ширина; периметр = сумма всех сторон.','Площадь — сколько клеточек внутри, периметр — длина забора вокруг.'],eq:['Неизвестное ищем как неизвестный компонент: слагаемое = сумма − другое слагаемое; множитель = произведение : другой множитель; делитель = делимое : частное.','Или переноси слагаемое через «=» с противоположным знаком, потом дели обе части на число при x.'],dec:['Десятичные умножаем как целые, потом ставим запятую: знаков после неё столько, сколько во всех множителях вместе.','Забудь про запятую, посчитай как обычно, а в конце верни запятую на место.'],fbas:['Смешанное число в неправильную дробь: целое · знаменатель + числитель, знаменатель остаётся.','Целое — это сколько целых «кусочков»: 3 = 3·5/5 = 15/5. Добавь ещё кусочки из дробной части.'],div:['На 3 и на 9 делится число, у которого сумма цифр делится на 3 (на 9). На 2 — последняя цифра чётная, на 5 — 0 или 5, на 10 — 0.','Складывай цифры числа: если сумма попадает в таблицу 3 или 9 — число делится.'],gcd:['НОД — наибольшее число, на которое делятся оба числа; НОК — наименьшее число, которое делится на оба. НОК = a·b : НОД.','НОД ищем среди делителей (сколько одинаковых групп), НОК — среди кратных (когда события совпадут).'],frac:['Чтобы сложить дроби с разными знаменателями, приведи их к общему знаменателю, потом сложи числители.','Нельзя складывать «кусочки» разного размера: сначала режем на одинаковые доли.'],prop:['В пропорции a : b = c : d произведение крайних равно произведению средних: a·d = b·c.','Если одна величина выросла в k раз, то и вторая выросла в k раз: ищи, во сколько раз.'],pct:['1 % — это одна сотая. p % от числа N = N · p : 100.','Сначала найди 1 % (раздели на 100), потом умножь на нужное число процентов.'],circ:['Длина окружности C = π·d = 2·π·r, где d — диаметр, r — радиус (d = 2r), π ≈ 3,14.','Диаметр — «ширина» круга через центр; обод больше диаметра примерно в 3,14 раза.'],neg:['Вычитание — это прибавление противоположного числа. Если вычитаем большее из меньшего, ответ отрицательный.','На числовой прямой: вычитать — идти влево. Перешла через ноль — получились числа со знаком «−».'],logic:['Задачи про «по 2 или по 3»: предположи, что все одного вида, посчитай, чего не хватает, и узнай, сколько «других».','Сначала вообрази самый простой случай, сравни с условием: разница подскажет, сколько надо «заменить».'],calc:['Порядок действий + деление на дробь = умножение на перевёрнутую дробь.','Скобки раскрывай по очереди, десятичные удобно превращать в обыкновенные дроби (0,25 = 1/4).'],eqm:['Смешанные числа переведи в неправильные дроби, потом ищи неизвестный компонент шаг за шагом.','Двигайся «от конца к началу»: убери последнее действие обратным, потом предпоследнее.'],len:['1 м = 10 дм = 100 см = 1000 мм.','Переведи всё в одну единицу (лучше в метры или в миллиметры), потом считай.'],vol:['Процент или долю бери от той величины, к которой они относятся. Объём параллелепипеда V = длина · ширина · высота.','Идём по порядку: нашли ширину, потом высоту, потом перемножили три числа.'],meet:['Навстречу: скорость сближения = v₁ + v₂; вдогонку: v₁ − v₂. Время = расстояние : скорость сближения.','Навстречу — «съедают» расстояние вдвоём, вдогонку — быстрый отыгрывает у медленного.'],expr:['Подобные слагаемые (с одной буквой) складываются: коэффициенты складываем, буква остаётся; числа без букв — отдельно.','Как яблоки с яблоками: 2a + 3a = 5a, а a и b складывать «в одно» нельзя.'],afrac:['Умножая дроби, перемножай числители и знаменатели и сокращай одинаковые множители. Деление — умножение на перевёрнутую дробь.','Сократи заранее: одинаковые буквы сверху и снизу «сгорают».'],lang:['«Квадрат суммы» = (a + b)², «сумма квадратов» = a² + b²; «частное» — деление, «произведение» — умножение.','Записывай выражение в том же порядке, как в предложении, и ставь скобки там, где сказано «сумма», «разность».'],inv:['Если 1/k ≈ v, то k ≈ 1 : v.','Раздели 1 на число и округли до ближайшего натурального.']};

async function afterLogin(session){const u=session.user,st=ls.get('st:'+u.id,null);
 if(S.owner&&S.owner!==u.id){ls.set('st:'+S.owner,S);S=st||DEF()}else if(!S.owner&&st)S=st;
 const anon=!!S.anon&&!S.owner;delete S.anon;user=u;S.owner=u.id;S.email=u.email;ls.set('st',S);addAcct(u.email);document.querySelector('#gate')?.remove();await pull(anon);S.owner=u.id;S.email=u.email;const pr=ls.get('pinReset',null);let rs=false;if(pr&&(pr=='*'||pr==u.email)){S.pin=null;ls.set('pinReset',null);pinClear();rs=true}save();ls.set('st',S);if(rs){page='parent';S.page='parent';toast('PIN сброшен. Задайте новый PIN.')}nav();render();if(rs)await push(true)}
const accts=()=>ls.get('accts',[]),addAcct=e=>ls.set('accts',[e,...accts().filter(x=>x!=e)].slice(0,4));
const overlay=h=>{document.querySelector('#gate')?.remove();const o=document.createElement('div');o.id='gate';o.className='lvl';o.style.cursor='default';o.innerHTML=h;o.addEventListener('pointerdown',e=>{if(e.target===o)o.remove()});document.body.appendChild(o);return o};
window.pickAcct=e=>{loginEmail=e;sendCode(e)};
function msgG(t){const e=$('#gm');if(e)e.textContent=t}
window.showLogin=(step=1,note='')=>{overlay(`<div class="card" style="max-width:440px;width:100%;text-align:left;color:var(--tx)"><h2>${step==1?'Вход в аккаунт':'Проверьте почту'}</h2>${note?`<p class="ok">${note}</p>`:''}<p class="mut">${step==1?'Введите e-mail, мы пришлём ссылку для входа. Пароль не нужен. С любого устройства после входа занятия продолжатся с того же места.':'Письмо отправлено на <b>'+esc(loginEmail)+'</b>. Откройте его и нажмите ссылку «Log In»: сайт откроется уже с вашим прогрессом. Если в письме есть код, введите его здесь. Письма иногда идут до минуты, проверьте папку «Спам».'}</p>
 ${step==1?`${accts().length?`<p class="mut" style="margin-bottom:4px">Недавние аккаунты:</p><div class="row" style="margin:0 0 8px">${accts().map(e=>`<button data-e="${esc(e)}" onclick="pickAcct(this.dataset.e)">${esc(e)}</button>`).join('')}</div>`:''}<input id="em" type="email" placeholder="e-mail" value="${esc(loginEmail)}" onkeydown="event.key=='Enter'&&sendCode()"><div class="row"><button class="pri" onclick="sendCode()">Получить ссылку для входа</button><button onclick="document.querySelector('#gate').remove()">Пока без входа</button></div>`:`<input id="cd" inputmode="numeric" placeholder="Код из письма (если есть)" onkeydown="event.key=='Enter'&&verifyCode()"><div class="row"><button class="pri" onclick="verifyCode()">Войти по коду</button><button onclick="sendCode(loginEmail)">Отправить письмо ещё раз</button><button onclick="showLogin(1)">Другой e-mail</button></div>`}
 <p id="gm" class="bad"></p></div>`)};
window.showAccount=()=>{if(!user)return showLogin();if(S.pin&&!pinOk())return go('parent');
 overlay(`<div class="card" style="max-width:440px;width:100%;text-align:left;color:var(--tx)"><h2>Аккаунт</h2><p>Вы вошли как <b>${esc(user.email)}</b></p><p class="mut">${{ok:'☁ Прогресс сохранён в облаке.',busy:'☁ Сохраняю…',err:'⚠ Нет связи: прогресс сохранится при появлении интернета.'}[syncState]||''}</p>
 <div class="row"><button onclick="syncNow();document.querySelector('#gate')?.remove()">Синхронизировать</button><button class="pri" onclick="logout(true)">Сменить аккаунт</button><button onclick="logout()">Выйти</button><button onclick="document.querySelector('#gate').remove()">Закрыть</button></div>
 <p class="mut" style="font-size:13px">При выходе прогресс этого аккаунта остаётся в облаке и на этом устройстве. Зайдя снова, вы продолжите с того же места.</p></div>`)};
window.sendCode=async(e)=>{loginEmail=(typeof e=='string'&&e)||$('#em').value.trim();if(!/.+@.+\..+/.test(loginEmail))return msgG('Проверьте e-mail');if($('#gm'))msgG('Отправляю…');const {error}=await sb.auth.signInWithOtp({email:loginEmail,options:{shouldCreateUser:true,emailRedirectTo:location.origin+location.pathname}});if(error)return msgG('Не получилось отправить: '+error.message);showLogin(2)};
window.verifyCode=async()=>{const t=$('#cd').value.trim();if(!t)return;msgG('Проверяю…');const {data,error}=await sb.auth.verifyOtp({email:loginEmail,token:t,type:'email'});if(error||!data.session)return msgG('Неверный или устаревший код');afterLogin(data.session)};
window.logout=async(sw)=>{if(!user)return;const uid=user.id;try{await push(true)}catch{}ls.set('st:'+uid,S);try{await sb.auth.signOut()}catch{}
 user=null;cur=null;clearInterval(exTimer);EXAM=null;ls.set('exam',null);S=DEF();S.anon=true;ls.set('st',S);pinClear();page='home';setSync('out');document.querySelector('#gate')?.remove();nav();render();showLogin(1,sw?'Вы вышли. Войдите в другой аккаунт.':'Вы вышли из аккаунта. Прогресс сохранён.')};
window.syncNow=async()=>{if(user){await push(true);await pull();nav();render()}};
addEventListener('online',()=>{if(dirty&&user)push(true)});setInterval(()=>{if(dirty&&user&&!document.hidden)push(true)},30000);
addEventListener('visibilitychange',()=>{if(document.hidden&&dirty&&user)push(true)});
(async()=>{if(!SUPA.url||!SUPA.key)return;if(!await loadSb()){setSync('err');nav();return}
 sb=window.supabase.createClient(SUPA.url,SUPA.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
 const hp=new URLSearchParams(location.hash.slice(1)),he=hp.get('error_code')||hp.get('error');
 try{const {data}=await sb.auth.getSession();if(data.session)await afterLogin(data.session);else{setSync('out');nav();showLogin();if(he){msgG(he=='otp_expired'?'Ссылка устарела или уже использована (почтовые программы иногда открывают её сами). Запросите новую и нажмите ссылку один раз.':'Не удалось войти по ссылке ('+(hp.get('error_description')||he).replace(/\+/g,' ')+'). Запросите новую.');history.replaceState(null,'',location.pathname)}}}catch{setSync('err');nav()}
 sb.auth.onAuthStateChange((ev,ses)=>{if(ev=='SIGNED_IN'&&ses&&!user)afterLogin(ses)})})();
pinClear();
page=(S.page&&PAGES[S.page])?S.page:'home';
if(page=='practice'&&S.cur&&S.cur.cur&&!S.cur.cur.solved){cur=S.cur.cur;hintN=S.cur.hintN||0}
if(page=='exam'&&!EXAM)page='home';
if(EXAM&&!EXAM.done)runEx();
addEventListener('visibilitychange',()=>{if(document.hidden)save()});addEventListener('pagehide',save);
try{navigator.storage?.persist?.()}catch{}
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
nav();render();
</script>
</body>
</html>
